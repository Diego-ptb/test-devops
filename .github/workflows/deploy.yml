name: Deploy Apache EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy a EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Deploy iniciado"

            # Instalar Node, Git y Apache si no existen (Amazon Linux)
            command -v node >/dev/null || sudo dnf install -y nodejs
            command -v git  >/dev/null || sudo dnf install -y git
            rpm -q httpd    >/dev/null || sudo dnf install -y httpd

            if [ ! -d "${{ github.event.repository.name }}" ]; then
              git clone ${{ github.server_url }}/${{ github.repository }}.git
            fi

            cd ${{ github.event.repository.name }}

            git fetch origin
            git reset --hard origin/main

            # Build de React
            npm ci
            npm run build

            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/
            sudo systemctl enable httpd
            sudo systemctl restart httpd

            echo "✅ Deploy terminado"
